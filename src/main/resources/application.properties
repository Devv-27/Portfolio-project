server.port=8080

# Database: H2 file DB by default (zero setup). For PostgreSQL set DB_URL, DB_USER, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/portfolio}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Auth
app.jwt.secret=${JWT_SECRET:debabrata-portfolio-cms-dev-secret-change-me-please-123456}
app.jwt.expiry-minutes=120
app.admin.username=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Uploads + CORS (React dev servers)
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.cors.origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Contact email (optional). Messages are always saved in DB even if email is not set up.
app.contact.to=${CONTACT_TO:}
